name: QuantEngine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC Debug"
            preset: "dev-debug"
            compiler: "g++"
          - name: "Linux GCC Release"
            preset: "dev-release"
            compiler: "g++"
          - name: "Linux GCC Sanitizers (ASan/UBSan)"
            preset: "dev-sanitizer"
            compiler: "g++"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential clang-format python3-pytest python3-dev

      - name: Check Code Formatting
        run: |
          find include src tests benchmarks bindings -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Run Tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
